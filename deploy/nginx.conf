worker_processes 1;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  map $uri $limiter_cache_control {
    default "no-store";
    ~*\.html$ "no-cache";
    ~*\.(js|css|woff2?|svg|png|ico)$ "public, max-age=31536000, immutable";
  }

  upstream limiter_management {
    server limiter-management:8080;
  }

  server {
    listen 80;

    # 页面与 API 由同一个业务 Nginx 承接，Gateway 原样转发公共路径。
    location ^~ /app/limiter-management/ {
      alias /usr/share/nginx/html/;
      try_files $uri $uri/ /app/limiter-management/index.html;
      add_header Cache-Control $limiter_cache_control;
    }

    # Gateway 保留 /api/limiter/；Management Server 的公开前缀为 /api/。
    location /api/limiter/ {
      proxy_pass http://limiter_management/api/;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      return 404;
    }
  }
}
